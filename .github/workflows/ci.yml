name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_USER: mazmi
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: mazmi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U mazmi -d mazmi_test'
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -r requirements.lock
      - run: ruff check .
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://mazmi:test_only@localhost:5432/mazmi_test
      - run: python -m app.migrate && python -m app.evaluate
        env:
          DATABASE_URL: postgresql://mazmi:test_only@localhost:5432/mazmi_test
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: docker compose -f ../docker-compose.yml config --quiet
