name: Secret scanning (Gitleaks)

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  scan:
    name: Scan git history for exposed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect exposed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
      - name: Audit every commit across all branches
        shell: bash
        run: |
          set -euo pipefail
          scanners=(/tmp/gitleaks-*/gitleaks)
          scanner="${scanners[0]}"
          if [ -z "$scanner" ]; then
            echo "::error::Gitleaks scanner is missing"
            exit 1
          fi
          "$scanner" git --redact --exit-code 2 --log-opts="--all" .
